  short_description: "管理授权频道、视频同步、上传、修改、删除、模板、批量和恢复"
  icon_small: "./assets/chatgrowing-icon.png"
  icon_large: "./assets/chatgrowing-icon.png"
  brand_color: "#16D768"
  default_prompt: "使用 $youtube-material-operations 管理当前授权的 YouTube 频道和素材任务。"

dependencies:
  tools:
