  short_description: "从多 App、多渠道和大量广告对象中筛出值得继续分析的问题对象"
  icon_small: "./assets/chatgrowing-icon.png"
  icon_large: "./assets/chatgrowing-icon.png"
  brand_color: "#16D768"
  default_prompt: "使用 $ads-portfolio-triage 扫描当前授权广告资产，并给出值得继续分析的对象和原因。"

dependencies:
  tools:
    - type: "mcp"
      value: "chatgrowing_ads_read"
      description: "ChatGrowing Ads Read Remote MCP server"
      transport: "streamable_http"
      url: "https://chatgrowing.com/mcp"

policy:
  allow_implicit_invocation: true
