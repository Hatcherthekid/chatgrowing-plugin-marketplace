interface:
  display_name: "Ads · 分析与决策"
  short_description: "查证广告事实、诊断原因并形成有边界的行动候选"
  icon_small: "./assets/chatgrowing-icon.png"
  icon_large: "./assets/chatgrowing-icon.png"
  brand_color: "#16D768"
  default_prompt: "使用 $ads-read-analysis 自由分析当前授权广告数据，核对支持、反证、缺失证据与行动边界。"

dependencies:
  tools:
    - type: "mcp"
      value: "chatgrowing_ads_read"
      description: "ChatGrowing Ads Read Remote MCP server"
      transport: "streamable_http"
      url: "https://chatgrowing.com/mcp"

policy:
  allow_implicit_invocation: true
