interface:
  display_name: "Ads · 数据定义与匹配"
  short_description: "定义实体、指标和标签并核对数据是否可用"
  icon_small: "./assets/chatgrowing-icon.png"
  icon_large: "./assets/chatgrowing-icon.png"
  brand_color: "#16D768"
  default_prompt: "使用 $ads-configuration 核对当前授权范围内的实体、指标、标签、source authority 和 freshness，并指出仍不能判断的定义。"

dependencies:
  tools:
    - type: "mcp"
      value: "chatgrowing_ads_read"
      description: "ChatGrowing Ads Read Remote MCP server"
      transport: "streamable_http"
      url: "https://chatgrowing.com/mcp"

policy:
  allow_implicit_invocation: true
