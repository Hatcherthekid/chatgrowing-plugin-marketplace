interface:
  display_name: "Ads · 监控与告警"
  short_description: "聚合余额、状态、政策、数据刷新和投递风险"
  icon_small: "./assets/chatgrowing-icon.png"
  icon_large: "./assets/chatgrowing-icon.png"
  brand_color: "#16D768"
  default_prompt: "使用 $ads-monitoring 检查当前授权范围内今天必须处理的监控和数据风险，并保留证据与无法判断项。"

dependencies:
  tools:
    - type: "mcp"
      value: "chatgrowing_ads_read"
      description: "ChatGrowing Ads Read Remote MCP server"
      transport: "streamable_http"
      url: "https://chatgrowing.com/mcp"

policy:
  allow_implicit_invocation: true
